<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>محطة كنعان للحروف</title>
  <meta name="description" content="بيئة تعلم سمعية تفاعلية للمرحلة الأساسية المبكرة: اسمع… اكتشف… انطق… ابنِ الكلمة">
  <meta name="theme-color" content="#1F4E35">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/station.css?v=20261127222744">
</head>
<body>
  <a class="skip-link" href="#stage">انتقل إلى النشاط</a>

  <!-- شريط المحطة: الهوية + رحلتي + التحكم بالمؤثرات. يختفي في شاشة الاستقبال. -->
  <header class="station-bar" id="station-bar" hidden>
    <button class="icon-btn home-btn" id="home-btn" type="button" aria-label="العودة إلى الصفحة الرئيسية (الاستوديو)">
      <span aria-hidden="true">🏠</span><span class="sfx-label">الرئيسية</span>
    </button>

    <div class="station-brand" aria-hidden="true">
      <span class="brand-icon">📻</span>
      <span class="brand-name">محطة كنعان للحروف</span>
    </div>

    <nav class="journey" aria-label="رحلتي في محطة كنعان">
      <p class="journey-title">رحلتي في محطة كنعان</p>
      <ol class="journey-steps" id="journey-steps"></ol>
    </nav>

    <p class="episode-chip" id="episode-chip"></p>

    <button class="icon-btn" id="dial-open" type="button">
      <span aria-hidden="true">🏆</span><span class="sfx-label">إنجازاتي</span>
    </button>

    <button class="icon-btn" id="sfx-toggle" type="button" aria-pressed="true">
      <span aria-hidden="true" class="sfx-icon">🔔</span>
      <span class="sfx-label">المؤثرات: تعمل</span>
    </button>
  </header>

  <main id="stage" class="stage" tabindex="-1" aria-live="off"></main>

  <!-- كنعان: يظهر فقط عند الحاجة إلى توجيه -->
  <aside class="host" id="host" aria-live="polite" hidden>
    <div class="host-avatar" id="host-avatar" role="img" aria-label="كنعان، مذيع المحطة"></div>
    <div class="host-bubble">
      <p class="host-text" id="host-text"></p>
      <button class="host-replay" id="host-replay" type="button" aria-label="أعد كلام كنعان">🔊</button>
    </div>
  </aside>

  <!-- منطقة إعلانات لقارئ الشاشة للتغذية الراجعة -->
  <div class="sr-only" id="announcer" aria-live="assertive"></div>

  <noscript><p class="noscript">تحتاج المحطة إلى تفعيل JavaScript.</p></noscript>

  <!-- البيانات (قابلة للتوسعة: أضف ملف حلقة جديد فقط) -->
  <script src="js/data/registry.js?v=20261127222744"></script>
  <script src="js/data/alphabet.js?v=20261127222744"></script>
  <script src="js/data/curriculum.js?v=20261127222744"></script>
  <!-- قائمة التسجيلات: تُحمَّل دائمًا بأحدث نسخة (لا نسخة مخزّنة قديمة بعد النشر) -->
  <script>document.write('<script src="js/data/audio-manifest.js?v=' + Date.now() + '"><\/script>');</script>
  <script src="js/data/scenes.js?v=20261127222744"></script>
  <!-- الحروف: ملف بيانات لكل حرف (الترتيب في curriculum.js) -->
  <script src="js/data/letters/baa.js?v=20261127222744"></script>
  <script src="js/data/letters/taa.js?v=20261127222744"></script>
  <script src="js/data/letters/thaa.js?v=20261127222744"></script>
  <script src="js/data/letters/jeem.js?v=20261127222744"></script>
  <script src="js/data/letters/haa.js?v=20261127222744"></script>
  <script src="js/data/letters/khaa.js?v=20261127222744"></script>
  <script src="js/data/letters/daal.js?v=20261127222744"></script>
  <script src="js/data/letters/thaal.js?v=20261127222744"></script>
  <script src="js/data/letters/sheen.js?v=20261127222744"></script>
  <script src="js/data/letters/meem.js?v=20261127222744"></script>
  <script src="js/data/letters/zay.js?v=20261127222744"></script>
  <script src="js/data/letters/ain.js?v=20261127222744"></script>

  <!-- النواة -->
  <script src="js/core/ui.js?v=20261127222744"></script>
  <script src="js/core/audio-lib.js?v=20261127222744"></script>
  <script src="js/core/sound.js?v=20261127222744"></script>
  <script src="js/core/progress.js?v=20261127222744"></script>
  <script src="js/core/recorder.js?v=20261127222744"></script>
  <script src="js/core/pronunciation.js?v=20261127222744"></script>
  <script src="js/core/host.js?v=20261127222744"></script>
  <script src="js/core/archive.js?v=20261127222744"></script>
  <script src="js/core/dial.js?v=20261127222744"></script>
  <script src="js/core/puppet.js?v=20261127222744"></script>
  <script src="js/core/studio.js?v=20261127222744"></script>
  <script src="js/core/panels.js?v=20261127222744"></script>

  <!-- الشاشات: كل شاشة نشاط مستقل يقرأ بياناته من الحلقة -->
  <script src="js/screens/welcome.js?v=20261127222744"></script>
  <script src="js/screens/mission.js?v=20261127222744"></script>
  <script src="js/screens/review.js?v=20261127222744"></script>
  <script src="js/screens/listen.js?v=20261127222744"></script>
  <script src="js/screens/signal.js?v=20261127222744"></script>
  <script src="js/screens/reveal.js?v=20261127222744"></script>
  <script src="js/screens/speak.js?v=20261127222744"></script>
  <script src="js/screens/build.js?v=20261127222744"></script>
  <script src="js/screens/write.js?v=20261127222744"></script>
  <script src="js/screens/position.js?v=20261127222744"></script>
  <script src="js/screens/transfer.js?v=20261127222744"></script>
  <script src="js/screens/success.js?v=20261127222744"></script>
  <script src="js/screens/onair.js?v=20261127222744"></script>
  <script src="js/screens/message.js?v=20261127222744"></script>

  <script src="js/app.js?v=20261127222744"></script>
</body>
</html>
